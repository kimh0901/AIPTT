<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slide Forge｜簡報產生器</title>
<meta name="description" content="以大綱與風格庫驅動的簡報生成工具。內容結構化生成，版面本地渲染，文字全程可編輯。自備 API 金鑰，資料留在自己的瀏覽器。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0D1016; --panel:#141821; --line:#252B37; --paper:#E9EDF3;
  --mute:#7A8496; --mark:#FF3D7F; --cy:#00C9C0; --warn:#FFB020;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ink); color:var(--paper);
  font-family:'IBM Plex Sans','Noto Sans TC',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
#app{height:100%;display:flex;flex-direction:column}
.mono{font-family:'IBM Plex Mono',monospace}
button{font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2A3140;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}

.btn{font-size:13px;font-weight:600;padding:9px 15px;border-radius:6px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--mute);letter-spacing:.2px;white-space:nowrap;
  transition:background .15s,border-color .15s,color .15s}
.btn:hover:not(:disabled){color:var(--paper);border-color:#39414f}
.btn.pri{background:var(--mark);color:#fff;border-color:var(--mark)}
.btn.pri:hover:not(:disabled){filter:brightness(1.1);color:#fff}
.btn.sm{font-size:12px;padding:6px 10px}
.btn.xs{font-size:10px;padding:3px 0;flex:1;border-radius:3px}
.btn.full{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}

.lbl{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mute);margin-bottom:7px;
  font-family:'IBM Plex Mono',monospace}
.hint{font-size:11px;color:var(--mute);margin-top:6px;line-height:1.55}
.field{margin-bottom:16px}
input[type=text],input[type=password],input[type=number],textarea,select{
  width:100%;background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 12px;
  color:var(--paper);font-size:14px;font-family:inherit;outline:none}
textarea{resize:vertical;line-height:1.6}
input:focus,textarea:focus,select:focus{border-color:var(--mark)}
input[type=range]{width:100%;accent-color:var(--mark)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px}
.scroll{overflow-y:auto;min-height:0}

.sw{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:10px;background:transparent}
.sw.on{border-color:var(--mark);background:var(--line)}
.sw .pick{display:flex;gap:8px;align-items:center;flex:1;min-width:0;background:none;border:none;padding:0;cursor:pointer;text-align:left}
.sw .nm{font-size:13px;font-weight:600;color:var(--paper)}
.sw .ds{font-size:11px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw .del{background:none;border:none;color:var(--mute);cursor:pointer;font-size:15px;line-height:1;padding:0 2px}
.chip{border:1px solid var(--line);background:transparent;color:var(--mute);font-size:11px;padding:5px 9px;border-radius:4px;cursor:pointer}
.chip.on{background:var(--mark);border-color:var(--mark);color:#fff}

.frame{width:100%;aspect-ratio:16/9;position:relative;overflow:hidden}
.stage{width:1280px;height:720px;position:absolute;top:0;left:0;transform-origin:top left}
[data-edit]{outline:none}
[contenteditable=true]{cursor:text}
[contenteditable=true]:hover{box-shadow:inset 0 0 0 1px rgba(255,61,127,.35)}
[contenteditable=true]:focus{box-shadow:inset 0 0 0 1px var(--mark)}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--panel);
  border:1px solid var(--mark);border-radius:8px;padding:10px 18px;font-size:13px;display:flex;gap:10px;
  align-items:center;z-index:80;max-width:min(560px,92vw);line-height:1.5}
.toast.bad{background:#2A1520}
.dot{width:7px;height:7px;border-radius:4px;background:var(--mark);flex:0 0 auto;animation:p 1s ease-in-out infinite}
@keyframes p{50%{opacity:.25}}
.modal{position:fixed;inset:0;background:rgba(5,7,11,.78);z-index:90;display:flex;align-items:center;
  justify-content:center;padding:20px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;
  width:min(520px,100%);max-height:88vh;overflow-y:auto}

#present{position:fixed;inset:0;background:#000;z-index:100;display:none;align-items:center;justify-content:center}
#present.on{display:flex}
#presentWrap{transform-origin:center center}
#presentHud{position:fixed;bottom:14px;right:18px;color:#66707f;font:12px/1 'IBM Plex Mono',monospace;letter-spacing:1px}

@media (max-width:900px){
  .home-grid{grid-template-columns:1fr!important}
  #rail,#insp{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="present"><div id="presentWrap"></div><div id="presentHud"></div></div>
<div id="layer"></div>

<script>
/* ============================================================================
   SLIDE FORGE — 單檔部署版
   資料全部留在使用者自己的瀏覽器，金鑰只放 localStorage，不會傳給任何第三方。
   ========================================================================== */

/* ---------- 常數 ---------- */
const PRESETS = [
  {id:'blueprint',name:'藍圖',desc:'工程製圖感，深藍底細線網格',bg:'#0E2233',surface:'#143047',ink:'#EAF4FA',sub:'#7FA8C4',accent:'#3FD2C7',accent2:'#F5A524',rule:'#255273',grid:true,radius:2,serif:false,prompt:'語氣精準、工程導向，要點用名詞短語，避免形容詞堆疊。'},
  {id:'proof',name:'印刷樣張',desc:'紙白底、黑墨、洋紅標記',bg:'#F4F2ED',surface:'#FFFFFF',ink:'#16181C',sub:'#6B7078',accent:'#E5197E',accent2:'#111318',rule:'#D5D1C8',grid:false,radius:0,serif:false,prompt:'語氣中性專業，像內部技術文件，句子短，不用行銷語言。'},
  {id:'midnight',name:'深夜霓虹',desc:'近黑底，青與洋紅高對比',bg:'#0B0B0F',surface:'#15151C',ink:'#F2F2F5',sub:'#8A8A99',accent:'#00E5C0',accent2:'#FF3D7F',rule:'#26262F',grid:false,radius:10,serif:false,prompt:'語氣有節奏感，標題短而有力，適合技術分享場合。'},
  {id:'field',name:'田野筆記',desc:'米白底、墨綠字，學術調性',bg:'#F2F1E9',surface:'#FBFAF5',ink:'#1E2B21',sub:'#5E6E62',accent:'#3F7D5B',accent2:'#B4652A',rule:'#D8D6C6',grid:false,radius:4,serif:true,prompt:'語氣沉穩，重視論證與資料來源，要點具體。'},
  {id:'bold',name:'巨型字體',desc:'白底黑字，黃色塊當重心',bg:'#FFFFFF',surface:'#FAFAFA',ink:'#0A0A0A',sub:'#5A5A5A',accent:'#FFD400',accent2:'#0A0A0A',rule:'#E4E4E4',grid:false,radius:0,serif:false,prompt:'語氣直接，每頁只講一件事，要點極短，最多八個字。'},
  {id:'sunrise',name:'晨光',desc:'漸暖底色，橘紅重點',bg:'#FFF6EE',surface:'#FFFFFF',ink:'#2A1D16',sub:'#7A6255',accent:'#E8622B',accent2:'#2F7D8C',rule:'#EBD9C9',grid:false,radius:8,serif:false,prompt:'語氣溫和好懂，適合對非技術聽眾說明。'}
];
const LAYOUTS = {cover:'封面',agenda:'目錄',bullets:'條列',twoCol:'雙欄對照',stat:'數據重點',chart:'資料圖表',quote:'引言',closing:'結尾'};
/* ============================================================
   課程主辦方請把這一行改成你的 Worker 網址，學員就不用自備金鑰。
   例：const COURSE_ENDPOINT = 'https://slideforge.你的帳號.workers.dev';
   留空的話，平台會退回「自備金鑰」與「用自己的 AI 工具」兩種模式。
   ============================================================ */
const COURSE_ENDPOINT = '';
const COURSE_MODELS = [
  {key:'gemini', label:'Gemini Flash'},
  {key:'geminiLite', label:'Gemini Flash-Lite'},
  {key:'claude', label:'Claude Sonnet'},
  {key:'claudeFast', label:'Claude Haiku'},
  {key:'gpt', label:'GPT'}
];

const PROVIDERS = {
  course:{label:'課程模式（不用自己準備金鑰）', proto:'proxy', free:'主辦方提供', vision:true,
    base:COURSE_ENDPOINT, model:'gemini', models:COURSE_MODELS.map(m=>m.key), keyUrl:'', rpm:0,
    note:'由課程主辦方統一提供模型額度，你只要填通行碼就能用。想換模型直接在上面選。'},
  gemini:{label:'Google Gemini', proto:'gemini', free:'免費額度', vision:true,
    base:'https://generativelanguage.googleapis.com', model:'gemini-3.5-flash-lite',
    models:['gemini-3.5-flash-lite','gemini-3.5-flash','gemini-3.1-flash-lite'],
    keyUrl:'https://aistudio.google.com/apikey', rpm:10,
    note:'申請金鑰不用信用卡。Flash-Lite 的每日次數最寬鬆，Flash 次之，Pro 在免費額度下幾乎只夠試用。Google 會調整額度，實際數字以官方頁面為準。'},
  openrouter:{label:'OpenRouter 免費模型', proto:'openai', free:'免費額度', vision:false,
    base:'https://openrouter.ai/api/v1', model:'openrouter/free',
    models:['openrouter/free'],
    keyUrl:'https://openrouter.ai/keys', rpm:20,
    note:'免費模型的 ID 結尾是 :free，名單會不定期輪動。填 openrouter/free 讓它自動挑一個還活著的。免費帳號大約每分鐘 20 次、每天 50 次。'},
  ollama:{label:'本機 Ollama', proto:'openai', free:'完全免費', vision:false,
    base:'http://localhost:11434/v1', model:'qwen3:8b',
    models:['qwen3:8b','llama3.1:8b','gemma3:12b'],
    keyUrl:'https://ollama.com/download', rpm:0,
    note:'模型跑在自己電腦上，沒有次數限制，資料也不外傳。需要先讓 Ollama 允許瀏覽器呼叫（設定 OLLAMA_ORIGINS=*），而且這個頁面最好也從本機開啟。金鑰欄位隨便填一個字即可。'},
  openai:{label:'其他 OpenAI 相容端點', proto:'openai', free:'', vision:true,
    base:'https://api.groq.com/openai/v1', model:'',
    models:[], keyUrl:'', rpm:0,
    note:'任何 OpenAI 相容服務都可以填在這裡，前提是它允許瀏覽器直接呼叫（CORS）。官方 api.openai.com 通常會被擋。'},
  anthropic:{label:'Anthropic', proto:'anthropic', free:'', vision:true,
    base:'https://api.anthropic.com', model:'claude-sonnet-4-5',
    models:['claude-sonnet-4-5','claude-haiku-4-5'],
    keyUrl:'https://console.anthropic.com/settings/keys', rpm:0,
    note:'品質最好，但沒有免費方案，claude.ai 的訂閱也不能用在 API 上。'}
};
const SERIF = "'Noto Serif TC',Georgia,serif";
const SANS  = "'IBM Plex Sans','Noto Sans TC',system-ui,sans-serif";

/* ---------- 狀態與儲存 ---------- */
const LS = {
  get(k,d){ try{ const v=localStorage.getItem('sf:'+k); return v===null?d:JSON.parse(v);}catch(e){return d} },
  set(k,v){ try{ localStorage.setItem('sf:'+k,JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem('sf:'+k);}catch(e){} }
};
const uid = ()=>Math.random().toString(36).slice(2,9);

let S = {
  view:'home', tab:'outline', cursor:0, busy:null, err:null, modal:null,
  topic:'', audience:'', tone:'', pages:0, instruction:'', brief:'', adv:false, rulesOpen:false,
  rules: LS.get('rules',null),
  wizard: LS.get('wizardDone',false)?false:true, step:1, scenario:null, md:'', plan:'', uploads:[],
  styleTab:'manual', msName:'', msBg:'#0E2233', msInk:'#EAF4FA', msAccent:'#3FD2C7', msRadius:0, msSerif:false,
  styleId: LS.get('styleId','blueprint'),
  styles: PRESETS.concat(LS.get('customStyles',[])),
  materials: [], tables: [], slides: [],
  economy: LS.get('economy',true),
  cfg: Object.assign(
    COURSE_ENDPOINT
      ? {provider:'course',base:COURSE_ENDPOINT,model:'gemini',key:'',maxTokens:6000,gapMs:1500}
      : {provider:'gemini',base:PROVIDERS.gemini.base,model:PROVIDERS.gemini.model,key:'',maxTokens:6000,gapMs:7000},
    LS.get('cfg',{}))
};
/* Google 已停止讓新使用者呼叫 2.5 Flash-Lite。保留金鑰與其他設定，只移轉舊模型名稱。 */
if(S.cfg.provider==='gemini' && /^(models\/)?gemini-2\.5-flash-lite$/.test(S.cfg.model||'')){
  S.cfg.model=PROVIDERS.gemini.model;
  LS.set('cfg',S.cfg);
}

/* 用量計數：讓人知道今天還剩多少免費額度 */
function today(){ return new Date().toISOString().slice(0,10); }
function usage(){
  const u = LS.get('usage',{d:today(),n:0});
  if(u.d!==today()){ u.d=today(); u.n=0; LS.set('usage',u); }
  return u;
}
function bumpUsage(){ const u=usage(); u.n++; LS.set('usage',u); return u.n; }
const draft = LS.get('draft',null);
if(draft){
  Object.assign(S,{topic:draft.topic||'',audience:draft.audience||S.audience,tone:draft.tone||S.tone,
    materials:draft.materials||[],tables:draft.tables||[],slides:draft.slides||[],styleId:draft.styleId||S.styleId,
    brief:draft.brief||'',md:draft.md||'',scenario:draft.scenario||null,plan:draft.plan||'',
    uploads:draft.uploads||[],step:Math.min(5,Math.max(1,draft.step||1))});
  if(S.slides.length) S.wizard=false;
}
const curStyle = ()=> S.styles.find(s=>s.id===S.styleId) || S.styles[0];
const saveCustom = ()=> LS.set('customStyles', S.styles.filter(s=>!PRESETS.some(p=>p.id===s.id)));
const saveDraft = ()=> LS.set('draft',{topic:S.topic,audience:S.audience,tone:S.tone,styleId:S.styleId,
  slides:S.slides,materials:S.materials,tables:S.tables,brief:S.brief,md:S.md,step:S.step,scenario:S.scenario,plan:S.plan,uploads:S.uploads});
function aiReady(){ return S.cfg.provider==='ollama' ? true : !!S.cfg.key; }
function modelLabel(){
  const m=S.cfg.model||'';
  if(S.cfg.provider==='course'){
    const f=COURSE_MODELS.find(x=>x.key===m); return f?f.label:m;
  }
  return m;
}

function set(patch,skipRender){ Object.assign(S,patch); if(!skipRender) render(); }
function toast(msg){ S.busy=msg; render(); }
function fail(msg){ S.busy=null; S.err=msg; render(); }
function done(){ S.busy=null; render(); }

/* ---------- 模型呼叫層（三種供應商） ---------- */
let lastCall = 0;
const sleep = ms => new Promise(r=>setTimeout(r,ms));

/* 免費額度通常卡在「每分鐘幾次」，所以呼叫之間強制留間隔 */
async function throttle(){
  const gap = Number(S.cfg.gapMs)||0;
  if(!gap) return;
  const wait = lastCall + gap - Date.now();
  if(wait>0){
    for(let left=Math.ceil(wait/1000); left>0; left--){
      if(S.busy) toast(String(S.busy).replace(/（.*?）$/,'')+'（等 '+left+' 秒，避開免費額度上限）');
      await sleep(1000);
    }
  }
  lastCall = Date.now();
}

async function ask(system, text, img){
  let lastErr;
  for(let attempt=0; attempt<3; attempt++){
    await throttle();
    try{ const out = await askOnce(system,text,img); bumpUsage(); return out; }
    catch(e){
      lastErr = e;
      if(!e.retryable || attempt===2) throw e;
      const wait = 20*(attempt+1);
      for(let left=wait; left>0; left--){
        toast('額度滿了，'+left+' 秒後再試一次');
        await sleep(1000);
      }
    }
  }
  throw lastErr;
}

async function askOnce(system, text, img){
  const c = S.cfg;
  const proto = (PROVIDERS[c.provider]||{}).proto || 'openai';
  if(!c.key && c.provider!=='ollama' && proto!=='proxy') throw new Error('還沒設定 API 金鑰，請點右上角「設定」。');
  const mt = Number(c.maxTokens)||2000;
  let url, headers, body, pick;

  if(proto==='proxy'){
    if(!c.base) throw new Error('課程模式尚未設定伺服器網址，請聯絡主辦方，或到設定改用其他方式。');
    url = c.base.replace(/\/$/,'');
    headers = {'content-type':'application/json','x-course-code':c.key||''};
    body = {model:c.model, system, text, maxTokens:mt, image:img||null};
    pick = d => d.text||'';

  }else if(proto==='anthropic'){
    url = c.base.replace(/\/$/,'')+'/v1/messages';
    headers = {'content-type':'application/json','x-api-key':c.key,
      'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
    const content = img
      ? [{type:'image',source:{type:'base64',media_type:img.media,data:img.b64}},{type:'text',text}]
      : text;
    body = {model:c.model,max_tokens:mt,system,messages:[{role:'user',content}]};
    pick = d => (d.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('\n');

  }else if(proto==='openai'){
    url = c.base.replace(/\/$/,'')+'/chat/completions';
    headers = {'content-type':'application/json','authorization':'Bearer '+(c.key||'ollama')};
    const content = img
      ? [{type:'text',text},{type:'image_url',image_url:{url:'data:'+img.media+';base64,'+img.b64}}]
      : text;
    body = {model:c.model,max_tokens:mt,messages:[{role:'system',content:system},{role:'user',content}]};
    pick = d => (((d.choices||[])[0]||{}).message||{}).content||'';

  }else{
    /* 瀏覽器直連 Gemini 時用查詢參數傳金鑰，避免 GitHub Pages 的 CORS 預檢
       因 x-goog-api-key 自訂標頭而被瀏覽器擋下。 */
    url = c.base.replace(/\/$/,'')+'/v1beta/models/'+encodeURIComponent(c.model)+':generateContent?key='+encodeURIComponent(c.key);
    headers = {'content-type':'application/json'};
    const parts = img ? [{inline_data:{mime_type:img.media,data:img.b64}},{text}] : [{text}];
    body = {systemInstruction:{parts:[{text:system}]},contents:[{role:'user',parts}],
      generationConfig:{maxOutputTokens:mt,temperature:0.7}};
    pick = d => (((d.candidates||[])[0]||{}).content||{}).parts?.map(p=>p.text||'').join('')||'';
  }

  let res;
  try{
    res = await fetch(url,{method:'POST',headers,body:JSON.stringify(body)});
  }catch(e){
    if(c.provider==='ollama') throw new Error('連不上本機 Ollama。請確認它正在執行，並且已設定 OLLAMA_ORIGINS=* 允許瀏覽器呼叫。');
    if(proto==='proxy') throw new Error('連不上課程伺服器，請確認網路，或稍後再試。');
    throw new Error('連不上這個服務。可能是網路問題，也可能是它不允許瀏覽器直接呼叫。');
  }
  /* Gemini 會不定期調整可用模型；舊瀏覽器也可能在 localStorage 留著已下架的模型名稱。
     收到 404 時，先依這把金鑰實際看得到的 models 清單選一個文字生成模型，再自動重試一次。 */
  if(!res.ok && res.status===404 && proto==='gemini'){
    try{
      const listUrl=c.base.replace(/\/$/,'')+'/v1beta/models?pageSize=1000&key='+encodeURIComponent(c.key);
      const listRes=await fetch(listUrl);
      if(listRes.ok){
        const data=await listRes.json();
        const available=(data.models||[])
          .filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent'))
          .map(m=>String(m.name||'').replace(/^models\//,''))
          .filter(Boolean);
        const preferred=[...(PROVIDERS.gemini.models||[]),...available.filter(m=>/flash/i.test(m)),...available];
        const next=preferred.find(m=>m!==c.model && available.includes(m));
        if(next){
          c.model=next;
          LS.set('cfg',c);
          url=c.base.replace(/\/$/,'')+'/v1beta/models/'+encodeURIComponent(next)+':generateContent?key='+encodeURIComponent(c.key);
          res=await fetch(url,{method:'POST',headers,body:JSON.stringify(body)});
        }
      }
    }catch(e){ /* 保留原始 Gemini 回應，交給下面的錯誤處理顯示 */ }
  }
  if(!res.ok){
    let detail='';
    try{ const j=await res.json();
      detail = typeof j.error==='string' ? j.error : ((j.error&&(j.error.message||j.error.type))||''); }catch(e){}
    if(res.status===401||res.status===403) throw mkErr(proto==='proxy'
      ? (detail||'通行碼不正確，請向課程主辦方索取。')
      : ('金鑰無效或沒有權限。'+(detail?'（'+detail+'）':'')));
    if(proto==='proxy' && detail) { const e=mkErr(detail); e.retryable = res.status===429||res.status>=500; throw e; }
    if(res.status===429){
      const e = mkErr('叫得太頻繁，或今天的免費額度用完了。'+(detail?'（'+detail+'）':''));
      e.retryable = true; throw e;
    }
    if(res.status>=500){ const e=mkErr('對方的服務暫時出問題（HTTP '+res.status+'）。'); e.retryable=true; throw e; }
    if(res.status===404) throw mkErr('Google 找不到「'+c.model+'」或這把金鑰無法使用該模型。已嘗試自動尋找可用模型仍失敗。'+(detail?'（'+detail+'）':''));
    throw mkErr('模型回應失敗 HTTP '+res.status+(detail?'：'+detail:''));
  }
  const out = pick(await res.json());
  if(!out) throw mkErr('AI 沒有回內容，再試一次，或換一個模型。');
  return out;
}
function mkErr(m){ return new Error(m); }

function parseJSON(raw){
  let t = String(raw).replace(/```json/gi,'').replace(/```/g,'').trim();
  t = t.replace(/^[\s\S]*?(?=[\[{])/,'');                    // 丟掉前面的贅語
  t = t.replace(/<think>[\s\S]*?<\/think>/gi,'').trim();      // 丟掉推理模型的思考段
  const end = Math.max(t.lastIndexOf(']'), t.lastIndexOf('}'));
  if(end>-1) t = t.slice(0,end+1);
  const tries = [
    t,
    t.replace(/,\s*([\]}])/g,'$1'),                           // 尾逗號
    t.replace(/,\s*([\]}])/g,'$1').replace(/[""]/g,'"').replace(/['']/g,"'"),
    closeBrackets(t.replace(/,\s*([\]}])/g,'$1'))             // 被截斷時補回括號
  ];
  for(const x of tries){ try{ return JSON.parse(x); }catch(e){} }
  throw new Error('AI 回的格式不對，通常是小模型才會這樣。可以到設定調高輸出上限、減少頁數，或換一個模型。');
}
/* 輸出被截斷時，把還沒關的括號補齊，至少救回前面完整的部分 */
function closeBrackets(t){
  let out='', inStr=false, esc=false; const stack=[];
  for(const ch of t){
    if(esc){ esc=false; out+=ch; continue; }
    if(ch==='\\'&&inStr){ esc=true; out+=ch; continue; }
    if(ch==='"'){ inStr=!inStr; out+=ch; continue; }
    if(!inStr){
      if(ch==='['||ch==='{') stack.push(ch===','?'':ch==='['?']':'}');
      else if(ch===']'||ch==='}') stack.pop();
    }
    out+=ch;
  }
  if(inStr) out+='"';
  out = out.replace(/,\s*$/,'').replace(/:\s*$/,':null');
  while(stack.length) out += stack.pop();
  return out;
}

/* ---------- 素材切塊與檢索 ---------- */
function chunkText(text,size){
  size = size||480;
  const out=[]; let buf='';
  String(text).replace(/\r/g,'').trim().split(/\n{2,}/).forEach(p=>{
    if((buf+p).length>size && buf){ out.push(buf.trim()); buf=''; }
    if(p.length>size){ for(let i=0;i<p.length;i+=size) out.push(p.slice(i,i+size)); }
    else buf += p+'\n\n';
  });
  if(buf.trim()) out.push(buf.trim());
  return out.filter(c=>c.length>20);
}
function bigrams(s){
  const t=String(s).toLowerCase().replace(/[\s.,;:!?、，。；：！？()「」【】]/g,'');
  const o=[]; for(let i=0;i<t.length-1;i++) o.push(t.slice(i,i+2)); return o;
}
function allChunks(){
  return S.materials.flatMap(m=>chunkText(m.text).map((t,i)=>({text:t,src:m.name,i})));
}
function retrieve(chunks,q,k){
  k=k||3; if(!chunks.length) return [];
  const g=[...new Set(bigrams(q))]; if(!g.length) return [];
  return chunks.map(c=>{
    const low=c.text.toLowerCase(); let sc=0;
    g.forEach(x=>{ if(low.includes(x)) sc++; });
    return Object.assign({},c,{score:sc/g.length});
  }).filter(c=>c.score>0.05).sort((a,b)=>b.score-a.score).slice(0,k);
}

const libCache={};

function loadOne(src, globalName){
  return new Promise((ok,no)=>{
    const el=document.createElement('script');
    el.src=src; el.async=true;
    const timer=setTimeout(()=>{ el.remove(); no(new Error('逾時')); }, 15000);
    el.onload=()=>{ clearTimeout(timer);
      window[globalName]?ok(src):no(new Error('載入後找不到 '+globalName)); };
    el.onerror=()=>{ clearTimeout(timer); el.remove(); no(new Error('連不到')); };
    document.head.appendChild(el);
  });
}

/* 回傳 {lib, url}，url 用來推導同版本的 worker 位置 */
async function loadLib(key){
  const def=LIBS[key];
  if(libCache[key]) return libCache[key];
  if(window[def.global]) return (libCache[key]={lib:window[def.global], url:def.urls[0]});
  const tried=[];
  for(const u of def.urls){
    try{
      const url=await loadOne(u, def.global);
      return (libCache[key]={lib:window[def.global], url});
    }catch(e){ tried.push(/^\.\//.test(u)?'本機 lib 資料夾':u.replace(/^https:\/\//,'').split('/')[0]); }
  }
  const err=new Error(`載入 ${def.file} 失敗，已試過：${tried.join('、')}。`+
    `如果貴單位網路擋外連，請把 ${def.file} 下載後放到與本頁面同一層的 lib 資料夾（./lib/${def.file}），重新整理即可離線使用。`);
  err.lib=key; throw err;
}

/* 相容舊呼叫方式 */
async function loadScript(src, globalName){
  const key=Object.keys(LIBS).find(k=>LIBS[k].global===globalName);
  if(key) return (await loadLib(key)).lib;
  return loadOne(src,globalName).then(()=>window[globalName]);
}

async function loadPdfjs(){
  const {lib,url}=await loadLib('pdfjs');
  lib.GlobalWorkerOptions.workerSrc = url.replace(/pdf(\.min)?\.js$/, 'pdf.worker$1.js');

}

function defaultTextStyle(s){

function slideTextStyle(s){

function webFontFamily(t,st){

      </div>`).join('')}</div></div>`;

    inner = `<div style="position:absolute;inset:0;padding:${P}px;display:flex;flex-direction:column">

  }

  return `<div style="position:absolute;inset:0;background:${st.bg};color:${st.ink};font-family:${SANS};overflow:hidden">

/* 把編輯路徑寫回資料 */
function applyEdit(idx, path, value){
  const s = S.slides[idx]; if(!s) return;
  pushHistory(idx);
  const p = path.split(':');
  if(p[0]==='title') s.title=value;
  else if(p[0]==='kicker') s.kicker=value;
  else if(p[0]==='subtitle') s.subtitle=value;
  else if(p[0]==='b'){ s.bullets=s.bullets||[]; if(s.bullets[+p[1]]) s.bullets[+p[1]][p[2]]=value; }
  else if(p[0]==='c'){ s.columns=s.columns||[];
    if(!s.columns[+p[1]]) return;
    if(p[2]==='h') s.columns[+p[1]].h=value; else s.columns[+p[1]].items[+p[3]]=value; }
  else if(p[0]==='stat'){ s.stat=s.stat||{}; s.stat[p[1]]=value; }
  else if(p[0]==='quote'){ s.quote=s.quote||{}; s.quote[p[1]]=value; }
  s.status='edited'; saveDraft();
}
function pushHistory(idx){
  const s=S.slides[idx]; if(!s) return;
  const clone = JSON.parse(JSON.stringify(Object.assign({},s,{history:undefined})));
  s.history = (s.history||[]).concat([clone]).slice(-6);
}

/* ---------- 檔案解析：Word / PDF / Excel / CSV / 文字 ---------- */
const ACCEPT = '.txt,.md,.markdown,.csv,.tsv,.docx,.pdf,.xlsx,.xls';

async function parseUpload(file){
  const name=file.name, ext=(name.split('.').pop()||'').toLowerCase();

  if(['txt','md','markdown','csv','tsv'].includes(ext)){
    const raw=await file.text();
    if(ext==='csv'||ext==='tsv'){
      const table=tableRecord(name,csvRows(raw,ext==='tsv'?'\t':','));
      return {text:tableDigest(table.title,[table.headers].concat(table.rows)),tables:[table]};
    }
    return {text:raw,tables:[]};
  }

  if(ext==='docx'){
    const mammoth=(await loadLib('mammoth')).lib;
    const r=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});
    return {text:r.value.trim(),tables:[]};
  }

  if(ext==='pdf'){
    const pdfjs=await loadPdfjs();
    const doc=await pdfjs.getDocument({data:await file.arrayBuffer()}).promise;
    const pages=Math.min(doc.numPages,40); const out=[];
    for(let i=1;i<=pages;i++){
      const c=await (await doc.getPage(i)).getTextContent();
      out.push(c.items.map(x=>x.str).join(' ').replace(/\s+/g,' ').trim());
    }
    const text=out.filter(Boolean).join('\n\n');
    if(!text.trim()) throw new Error('這份 PDF 讀不到文字，可能是掃描檔或圖片檔。請改用可選取文字的 PDF，或直接把內容貼進框裡。');
    return {text:text + (doc.numPages>pages?`\n\n（原檔共 ${doc.numPages} 頁，只讀取前 ${pages} 頁）`:''),tables:[]};
  }

  if(ext==='xlsx'||ext==='xls'){
    const XLSX=(await loadLib('xlsx')).lib;
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    const tables=wb.SheetNames.slice(0,3).map(sn=>{
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,blankrows:false,defval:''});
      return tableRecord(`${name} / 工作表：${sn}`,rows);
    }).filter(t=>t.headers.length);
    return {text:tables.map(t=>tableDigest(t.title,[t.headers].concat(t.rows))).join('\n\n'),tables};
  }

  throw new Error(`還不支援 .${ext} 這種檔案。可以先另存成 PDF、Word、Excel 或純文字，或直接把內容貼進框裡。`);
}

function csvRows(raw, sep){
  return raw.replace(/\r/g,'').split('\n').filter(l=>l.trim())
    .map(l=>l.split(sep).map(c=>c.replace(/^"|"$/g,'').trim()));
}

function tableRecord(title,rows){
  rows=(rows||[]).filter(r=>r && r.some(c=>String(c).trim()!==''));
  if(!rows.length) return {id:uid(),title,headers:[],rows:[]};
  const headers=rows[0].map((c,i)=>String(c).trim()||('欄位 '+(i+1)));
  const body=rows.slice(1,201).map(r=>headers.map((_,i)=>String(r[i]==null?'':r[i]).trim()));
  return {id:uid(),title,headers,rows:body};
}
function ensureBriefTables(){
  if((S.tables||[]).some(t=>numericColumns(t).length)) return;
  const lines=String(S.brief||'').replace(/\r/g,'').split('\n'), groups=[]; let cur=[];
  const flush=()=>{ if(cur.length>=3) groups.push(cur); cur=[]; };
  lines.forEach(line=>{ if((line.match(/\|/g)||[]).length>=2) cur.push(line); else flush(); }); flush();
  groups.forEach((group,gi)=>{
    const rows=group.map(line=>line.split('|').map(x=>x.trim()).filter((_,i,a)=>!(i===0&&a[i]==='')&&!(i===a.length-1&&a[i]==='')))
      .filter((row,i)=>!(i===1&&row.every(cell=>/^:?-{2,}:?$/.test(cell))));
    const table=tableRecord('貼上素材 / 資料表 '+(gi+1),rows); table.origin='brief';
    if(numericColumns(table).length) S.tables.push(table);
  });
  if(groups.length) saveDraft();
}

/* 把表格轉成文字，並且先在本機算好統計，不要讓 AI 自己加總 */
function tableDigest(title, rows){
  rows=(rows||[]).filter(r=>r && r.some(c=>String(c).trim()!==''));
  if(!rows.length) return `【${title}】（空白表格）`;
  const head=rows[0].map(c=>String(c).trim());
  const body=rows.slice(1).map(r=>head.map((_,i)=>String(r[i]==null?'':r[i]).trim()));

  const num=s=>{
    const t=String(s).replace(/[,，\s%％]/g,'').replace(/^\+/,'');
    if(t===''||isNaN(Number(t))) return null;
    return Number(t);
  };
  const stats=[];
  head.forEach((h,ci)=>{
    if(ci===0) return;
    const vals=body.map(r=>num(r[ci])).filter(v=>v!==null);
    if(vals.length < Math.max(3, body.length*0.6)) return;   // 不是數值欄就跳過
    const sum=vals.reduce((a,b)=>a+b,0);
    const pairs=body.map(r=>({k:r[0], v:num(r[ci])})).filter(p=>p.v!==null)
      .sort((a,b)=>b.v-a.v);
    const fmt=n=>Number.isInteger(n)?n.toLocaleString():n.toFixed(2);
    stats.push(`- ${h}：合計 ${fmt(sum)}｜平均 ${fmt(sum/vals.length)}｜`+
      `最高 ${pairs[0].k} ${fmt(pairs[0].v)}｜最低 ${pairs[pairs.length-1].k} ${fmt(pairs[pairs.length-1].v)}\n`+
      `  前三名：${pairs.slice(0,3).map(p=>`${p.k} ${fmt(p.v)}`).join('、')}`);
  });

  const table=[head.join(' | ')].concat(body.slice(0,60).map(r=>r.join(' | '))).join('\n');
  return `【${title}】共 ${body.length} 列資料\n\n${table}`
    + (body.length>60?`\n（僅列出前 60 列）`:'')
    + (stats.length?`\n\n※ 以下統計已由系統精確計算，請直接引用，不要自行加總：\n${stats.join('\n')}`:'');
}

/* ---------- AI 圖表助手：AI 選欄位，本機取值與繪圖 ---------- */
function chartNum(value){
  let t=String(value==null?'':value).trim();
  const neg=/^\(.*\)$/.test(t); t=t.replace(/[(),，\s%％]/g,'').replace(/^\+/, '');
  if(t===''||!Number.isFinite(Number(t))) return null;
  return (neg?-1:1)*Number(t);
}
function numericColumns(table){
  return (table.headers||[]).map((name,index)=>{
    const vals=(table.rows||[]).map(r=>chartNum(r[index])).filter(v=>v!==null);
    return {name,index,count:vals.length};
  }).filter(c=>c.index>0 && c.count>=Math.max(2,Math.ceil((table.rows||[]).length*.5)));
}
function slideChartContext(slide,index){
  slide=slide||{};
  return {
    page:(index==null?S.cursor:index)+1, layout:slide.layout||'bullets',
    title:slide.title||'', subtitle:slide.subtitle||'', kicker:slide.kicker||'',
    bullets:(slide.bullets||[]).map(b=>({heading:b.h||'',detail:b.d||''})),
    columns:(slide.columns||[]).map(c=>({heading:c.h||'',items:c.items||[]})),
    stat:slide.stat||null, quote:slide.quote||null, speakerNote:slide.note||''
  };
}
function chartContextText(slide){
  const c=slideChartContext(slide,S.cursor);
  return [c.title,c.subtitle,c.kicker,c.speakerNote,
    ...c.bullets.flatMap(b=>[b.heading,b.detail]),
    ...c.columns.flatMap(col=>[col.heading,...col.items]),
    c.stat&&c.stat.value,c.stat&&c.stat.label,c.quote&&c.quote.text,c.quote&&c.quote.by]
    .filter(Boolean).join(' ').toLowerCase();
}
function chartTerms(text){
  const chunks=String(text||'').toLowerCase().replace(/[%％]/g,' 比率 ')
    .split(/[^\p{L}\p{N}]+/u).filter(Boolean), out=new Set();
  chunks.forEach(chunk=>{
    if(chunk.length>=2) out.add(chunk);
    if(/[\u3400-\u9fff]/.test(chunk)){
      for(let n=2;n<=Math.min(4,chunk.length);n++) for(let i=0;i<=chunk.length-n;i++) out.add(chunk.slice(i,i+n));
    }
  });
  return out;
}
function chartRelevance(context,label){
  const a=String(context||'').toLowerCase().replace(/\s+/g,''), b=String(label||'').toLowerCase().replace(/\s+/g,'');
  if(!a||!b) return 0;
  let score=a.includes(b)?50:0;
  const at=chartTerms(context), bt=chartTerms(label);
  bt.forEach(t=>{ if(at.has(t)) score+=Math.min(12,t.length*3); });
  return score;
}
function rankedChartTables(slide){
  const context=chartContextText(slide);
  return (S.tables||[]).filter(t=>numericColumns(t).length).map(table=>{
    const cols=numericColumns(table).map(col=>Object.assign({},col,{relevance:chartRelevance(context,col.name)}))
      .sort((a,b)=>b.relevance-a.relevance);
    const score=chartRelevance(context,table.title)+Math.max(0,...cols.map(c=>c.relevance))+
      chartRelevance(context,(table.headers||[])[0]);
    return {table,columns:cols,score};
  }).sort((a,b)=>b.score-a.score);
}
function chartTableInfo(table,context){
  const nums=numericColumns(table);
  const summaries=nums.map(col=>{
    let pairs=(table.rows||[]).map(r=>({label:String(r[0]||''),value:chartNum(r[col.index])})).filter(x=>x.value!==null);
    if(pairs.length>3) pairs=pairs.filter(x=>!/(總計|合計|total)/i.test(x.label));
    if(!pairs.length) return `${col.name}（數值欄）`;
    const top=pairs.slice().sort((a,b)=>b.value-a.value)[0];
    return `${col.name}（與本頁相關度 ${chartRelevance(context,col.name)}；${pairs.length} 筆；最高：${top.label} ${top.value}）`;
  });
  return {id:table.id,title:table.title,headers:table.headers,numeric:summaries,
    relevance:chartRelevance(context,[table.title,...table.headers].join(' ')),sample:(table.rows||[]).slice(0,6)};
}

[簡報整體脈絡]
主題：${S.topic||'未命名簡報'}
對象：${S.audience||'未指定'}
語氣：${S.tone||'未指定'}

[目前選取頁面｜這是判斷圖表內容的主要依據]

請只輸出一個 JSON 物件：

內容原則：

- 不要自行產生、修改、加總或換算任何數值。只輸出 JSON。`;

function resolveColumn(table,value,fallback){
  if(Number.isInteger(value) && value>=0 && value<table.headers.length) return value;
  const i=(table.headers||[]).findIndex(h=>String(h).trim()===String(value||'').trim());
  return i>=0?i:fallback;
}
function quickChartSpec(){
  const cur=S.slides[S.cursor]||{}, ranked=rankedChartTables(cur), hit=ranked[0];
  if(!hit) throw new Error('找不到可以支撐本頁內容的數值欄。請上傳含有標題列與數值欄的 Excel 或 CSV。');
  const table=hit.table, col=hit.columns[0]||numericColumns(table)[0], category=table.headers[0]||'';
  const timeLike=/(年|月|日|季|週|week|month|year|date|time)/i.test(category+' '+col.name);
  const longLabels=(table.rows||[]).slice(0,10).some(r=>String(r[0]||'').length>8);
  const title=(cur.kicker||cur.title||col.name+'比較').slice(0,20);
  return {tableId:table.id,type:timeLike?'line':longLabels?'bar':'column',categoryColumn:category,
    valueColumns:[col.name],sort:timeLike?'source':'desc',limit:8,title,
    kicker:(col.name+'呈現本頁重點的資料差異').slice(0,24),
    note:('本圖依第 '+(S.cursor+1)+' 頁「'+(cur.title||'未命名')+'」內容選取 '+col.name+'。').slice(0,30)};
}
function chartSlideFromSpec(spec){
  spec=spec||{};
  const source=S.slides[S.cursor]||{}, ranked=rankedChartTables(source);
  const exact=(S.tables||[]).find(t=>t.id===spec.tableId||t.title===spec.tableId);
  const table=exact || (!spec.tableId&&ranked[0]?ranked[0].table:null);
  if(!table) throw new Error('AI 指定的資料表不存在，請重新生成，避免改用與本頁無關的資料。');
  const numeric=numericColumns(table);
  if(!numeric.length) throw new Error('這份資料表沒有足夠的數值可畫圖。');
  const categoryIndex=resolveColumn(table,spec.categoryColumn,0);
  let valueIndices=(Array.isArray(spec.valueColumns)?spec.valueColumns:[])
    .map(v=>resolveColumn(table,v,-1)).filter(i=>numeric.some(n=>n.index===i));
  if(!valueIndices.length) valueIndices=[numeric.slice().sort((a,b)=>
    chartRelevance(chartContextText(source),b.name)-chartRelevance(chartContextText(source),a.name))[0].index];
  const type=['column','bar','line','doughnut'].includes(spec.type)?spec.type:'column';
  if(type==='doughnut') valueIndices=valueIndices.slice(0,1); else valueIndices=valueIndices.slice(0,2);
  let rows=(table.rows||[]).map(r=>({label:String(r[categoryIndex]||'').trim(),
    values:valueIndices.map(i=>chartNum(r[i]))})).filter(r=>r.label&&r.values.some(v=>v!==null));
  if(rows.length>3) rows=rows.filter(r=>!/(總計|合計|total)/i.test(r.label));
  if(spec.sort==='desc' || (spec.sort!=='source'&&type!=='line')) rows.sort((a,b)=>(b.values[0]||0)-(a.values[0]||0));
  const limit=Math.max(3,Math.min(10,Number(spec.limit)||8)); rows=rows.slice(0,limit);
  if(rows.length<2) throw new Error('可用的圖表資料少於兩筆。');
  const labels=rows.map(r=>r.label);
  const series=valueIndices.map((column,si)=>({name:table.headers[column]||('數值 '+(si+1)),
    values:rows.map(r=>r.values[si]===null?0:r.values[si])}));
  return normalize({layout:'chart',title:spec.title||series[0].name+'比較',kicker:spec.kicker||'',
    chart:{type,labels,series,source:table.title,category:table.headers[categoryIndex]},
    chartSource:{slideId:source.id||'',page:S.cursor+1,title:source.title||''},
    note:spec.note||('圖表資料來源：'+table.title)});
}

}

/* 解析 AI 回覆。盡量寬鬆：不同工具的 Markdown 習慣差很多 */
function parseMarkdownDeck(text){
  let t=String(text).replace(/\r/g,'').trim();
  if(!t) throw new Error('內容是空的，請先把 AI 的回覆貼進來。');

  if(/^[\[{]/.test(t)){
    try{
      const o=parseJSON(t); const arr=Array.isArray(o)?o:(o.slides||[]);
      if(arr.length) return arr.map(x=>normalize(x));
    }catch(e){ /* 不是 JSON 就繼續走 Markdown */ }
  }

  t = t.replace(/<think>[\s\S]*?<\/think>/gi,'')      // 推理模型的思考段
       .replace(/^\s*```[a-z]*\s*$/gim,'')            // 程式碼圍籬
       .replace(/^[＃#]/gm,'#')                        // 全形井號
       .replace(/^[　\t]+/gm,'')                       // 全形空白縮排
       .replace(/^[－—–]\s*/gm,'- ');                  // 各種破折號當條列

  const heading = L =>{
    let m;
    if((m=L.match(/^#{1,6}\s*(.+?)\s*$/))) return m[1];
    if((m=L.match(/^\*\*(.+?)\*\*\s*[：:]?\s*$/))) return m[1];          // 只有粗體的一行
    if((m=L.match(/^(?:第\s*\d+\s*頁|投影片\s*\d+|頁\s*\d+|Slide\s*\d+)\s*[：:．.、\-]?\s*(.*)$/i)))
      return m[1]||L.trim();                                             // 第 1 頁：xxx
    return null;
  };
  const kicker = L =>{
    let m;
    if((m=L.match(/^[>＞]\s*(.+?)\s*$/))) return m[1];
    if((m=L.match(/^\**(?:核心結論|重點結論|結論|一句話)\**\s*[：:]\s*(.+?)\s*$/))) return m[1];
    return null;
  };
  const bullet = L =>{
    let m;
    if((m=L.match(/^[-*•‧·+◦▪]\s*(.+?)\s*$/))) return m[1];
    if((m=L.match(/^\d+\s*[.、)）]\s*(.+?)\s*$/))) return m[1];
    return null;
  };
  const clean = s => String(s).replace(/\*\*/g,'').replace(/^\s*[:：]\s*/,'').trim();
  // AI 常在最後加一句客套話，不要把它當成條列
  const CLOSER=/^(希望|以上|如需|如果需要|需要我|請問|讓我知道|有任何|祝|Hope|Let me know|Feel free)/;

  const lines=t.split('\n');
  const slides=[]; let cur=null;
  lines.forEach(L=>{
    if(!L.trim()) return;
    const h=heading(L);
    if(h!==null && clean(h)){ cur={title:clean(h),kicker:'',bullets:[]}; slides.push(cur); return; }
    if(!cur) return;
    const k=kicker(L);
    if(k!==null && !cur.kicker){ cur.kicker=clean(k); return; }
    const b=bullet(L);
    if(b!==null && clean(b)){ cur.bullets.push(clean(b)); return; }
    // 沒有符號的普通句子：短的當結論，長的當一條要點
    const plain=clean(L);
    if(!plain || CLOSER.test(plain)) return;
    if(!cur.kicker && plain.length<=30 && !cur.bullets.length) cur.kicker=plain;
    else cur.bullets.push(plain);
  });

  // 完全沒抓到標題時，用空行分段當作分頁
  if(!slides.length){
    t.split(/\n{2,}/).forEach(block=>{
      const ls=block.split('\n').map(x=>x.trim()).filter(Boolean);
      if(!ls.length) return;
      const s={title:clean(ls[0]).slice(0,40),kicker:'',bullets:[]};
      ls.slice(1).forEach(L=>{ const b=bullet(L); s.bullets.push(clean(b!==null?b:L)); });
      slides.push(s);
    });
  }
  if(!slides.length){
    throw new Error('看不出來哪裡分頁。每頁的標題用 # 開頭，或用「第 1 頁：」開頭，也可以每頁之間空一行。');
  }

  return slides.map((x,i)=>{
    // 只有在不會弄丟內容時才套用封面／結尾版型
    const isFirst=i===0, isLast=i===slides.length-1 && slides.length>1;
    let layout='bullets';
    if(isFirst && !x.bullets.length) layout='cover';
    else if(isLast && x.bullets.length<=3) layout='closing';
    const s=normalize({
      layout, title:x.title,
      subtitle: layout==='cover'?x.kicker:'',
      bullets:x.bullets.slice(0,6).map(one=>{
        const m=one.match(/^(.{2,18}?)[：:]\s*(.+)$/) || one.match(/^(.{4,16}?)[，、]\s*(.{6,})$/);
        return m?{h:m[1],d:m[2]}:{h:one,d:''};
      })
    });
    s.kicker = layout==='cover'?'':x.kicker;
    s.note = x.kicker||'';
    s.status='generated';
    return s;
  });
}

async function genOne(i,silent){

  if(!silent) toast('重新生成第 '+(i+1)+' 頁');
  const st=curStyle();
  const hits = retrieve(allChunks(), s.title+' '+(s.bullets||[]).map(b=>b.h).join(' '));
  const sys='你是簡報內容編輯。只輸出單一 JSON 物件，不要任何說明或 markdown 圍籬。';
  const prompt =
`為這一頁補完內容。

簡報主題：${S.topic}｜對象：${S.audience}｜語氣：${S.tone}
風格提示：${st.prompt}

目前這頁：
${JSON.stringify({layout:s.layout,title:s.title,bullets:s.bullets,subtitle:s.subtitle})}

可用素材：
${hits.length? hits.map(h=>'['+h.src+'] '+h.text.slice(0,300)).join('\n') : '（無，請依主題常識撰寫）'}

依 layout 輸出對應欄位的 JSON 物件：
- cover：title、subtitle
- agenda / bullets / closing：title、bullets（3–4 個 {h,d}）
- twoCol：title、columns（兩個 {h, items:[3個字串]}）
- stat：title、stat {value,label}，value 是數字或短詞
- quote：quote {text,by}
所有版型都要有 note（講稿一句，30 字內）。
繁體中文，h 不超過 16 字，d 不超過 26 字。只輸出 JSON。`;
  const o = parseJSON(await ask(sys,prompt));
  pushHistory(i);
  if(o.title) s.title=o.title;
  if(o.subtitle) s.subtitle=o.subtitle;
  if(Array.isArray(o.bullets)) s.bullets=o.bullets.map(b=> typeof b==='string'?{h:b,d:''}:{h:b.h||'',d:b.d||''});
  if(o.columns) s.columns=o.columns;
  if(o.stat) s.stat=o.stat;
  if(o.quote) s.quote=o.quote;
  if(o.note) s.note=o.note;
  s.status='generated'; saveDraft();
  if(!silent) done();
}

async function importStyle(file){
  try{
    let b64, media;
    if(/pdf$/i.test(file.name) || file.type==='application/pdf'){
      toast('讀取 PDF 首頁');
      const pdfjs = await loadPdfjs();
      const doc = await pdfjs.getDocument({data:await file.arrayBuffer()}).promise;
      const page = await doc.getPage(1), vp = page.getViewport({scale:1.6});
      const cv = document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height;
      await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
      b64 = cv.toDataURL('image/jpeg',.85).split(',')[1]; media='image/jpeg';
    }else if(/^image\//.test(file.type)){
      b64 = await fileB64(file); media = file.type==='image/png'?'image/png':'image/jpeg';
    }else{
      return fail('風格匯入只支援 PDF 或圖片（PNG / JPG）。PPTX 請先另存成 PDF。');
    }
    toast('分析配色中');
    const sys='你是簡報視覺分析師。只輸出單一 JSON 物件，不要說明文字。';
    const o = parseJSON(await ask(sys,
`分析這張簡報畫面，抽取可重複使用的視覺風格。

輸出：
{"name":"四字以內名稱","desc":"12字內說明","bg":"#hex 背景","surface":"#hex 卡片底","ink":"#hex 主文字","sub":"#hex 次文字","accent":"#hex 主重點色","accent2":"#hex 次重點色","rule":"#hex 線條","grid":布林（是否有可見格線）,"radius":0-16,"serif":布林（標題是否襯線）,"prompt":"20字內文案語氣指示"}

顏色請取畫面實際出現的色票，不要臆測。只輸出 JSON。`, {media,b64}));
    addStyle(o, '來自 '+file.name.slice(0,12));
  }catch(e){ fail(e.message); }
}

function addStyle(o, fallbackDesc){
  const ns = {id:uid(), name:o.name||'自訂風格', desc:o.desc||fallbackDesc,
    bg:o.bg||'#101319', surface:o.surface||'#1A1E27', ink:o.ink||'#F0F2F6', sub:o.sub||'#8A93A6',
    accent:o.accent||'#FF3D7F', accent2:o.accent2||'#00C2CB', rule:o.rule||'#2A303C',
    grid:!!o.grid, radius:Number(o.radius)||0, serif:!!o.serif, prompt:o.prompt||'語氣自然、具體。'};
  S.styles=S.styles.concat([ns]); S.styleId=ns.id;
  saveCustom(); LS.set('styleId',ns.id); saveDraft(); done();
}

async function exportPPTX(){
  toast('打包 PPTX 中');
  try{
    const Pptx = (await loadLib('pptx')).lib;
    const st=curStyle(), pptx=new Pptx();
    pptx.defineLayout({name:'SF16x9',width:13.333,height:7.5}); pptx.layout='SF16x9';
    pptx.title = S.topic||'簡報';
    const hx=c=>String(c||'#000000').replace('#','').toUpperCase();
    const M=0.8, W=13.333-M*2;

    S.slides.forEach((s,idx)=>{
      const sl=pptx.addSlide();
      const tx=slideTextStyle(s), FD=pptFontFamily(tx,st), FB=FD;
      const titleColor=hx(tx.titleColor||st.ink), bodyColor=hx(tx.bodyColor||st.sub);
      const titleOpts={fontSize:tx.titleSize,bold:!!tx.titleBold,italic:!!tx.titleItalic,color:titleColor,fontFace:FD,align:tx.align};
      const bodyOpts={fontSize:tx.bodySize,bold:!!tx.bodyBold,italic:!!tx.bodyItalic,color:bodyColor,fontFace:FB,align:tx.align};
      sl.background={color:hx(st.bg)};
      if(s.note) sl.addNotes(s.note);
      const ky = s.kicker ? 0.5 : 0;   // 有核心結論就把內容往下推
      const kick=()=>{ if(s.kicker) sl.addText(s.kicker,
        {x:M,y:.72,w:W,h:.45,...bodyOpts,fontSize:Math.max(12,tx.bodySize-3),bold:true,color:hx(st.accent),valign:'top'}); };
      const foot=()=>{
        sl.addText(String(idx+1).padStart(2,'0')+' / '+String(S.slides.length).padStart(2,'0'),
          {x:W-1.2+M,y:6.75,w:1.2,h:.3,align:'right',fontSize:10,color:hx(st.sub),fontFace:'Consolas'});
        if(s.footer) sl.addText(s.footer,{x:M,y:6.75,w:6,h:.3,fontSize:10,color:hx(st.sub),fontFace:'Consolas'});
      };
      if(s.layout==='cover'){
        sl.addShape(pptx.ShapeType.rect,{x:M,y:2.2,w:.96,h:.06,fill:{color:hx(st.accent)}});
        sl.addText(s.title||'',{x:M,y:2.5,w:W,h:1.6,...titleOpts,valign:'top'});
        if(s.subtitle) sl.addText(s.subtitle,{x:M,y:4.2,w:W*.7,h:.8,...bodyOpts});
      }else if(s.layout==='stat'){
        kick();
        sl.addText(s.title||'重點數據',{x:M,y:1.9,w:W,h:.5,...titleOpts,fontSize:Math.max(12,tx.titleSize*.45),color:hx(st.accent),charSpacing:2});
        sl.addText(String((s.stat&&s.stat.value)||'—'),{x:M,y:2.3,w:W,h:2,fontSize:Math.max(72,tx.titleSize*2.5),bold:true,italic:!!tx.titleItalic,color:hx(st.accent),fontFace:FD,align:tx.align});
        sl.addText((s.stat&&s.stat.label)||'',{x:M,y:4.5,w:W*.75,h:.9,...bodyOpts,color:hx(tx.bodyColor||st.ink)});
        foot();
      }else if(s.layout==='chart' && s.chart){
        kick();
        sl.addText(s.title||'資料圖表',{x:M,y:.75+ky,w:W,h:.72,...titleOpts,valign:'top'});
        const type=s.chart.type||'column', labels=(s.chart.labels||[]).slice(0,10);
        const data=(s.chart.series||[]).slice(0,type==='doughnut'?1:2).map(one=>({
          name:one.name||'數值',labels,values:(one.values||[]).slice(0,labels.length).map(v=>Number(v)||0)
        }));
        const chartType=type==='line'?pptx.ChartType.line:type==='doughnut'?pptx.ChartType.doughnut:pptx.ChartType.bar;
        sl.addChart(chartType,data,{x:M,y:1.58+ky,w:W,h:4.75-ky,
          barDir:type==='bar'?'bar':'col',showTitle:false,showLegend:data.length>1,legendPos:'b',
          chartColors:[hx(st.accent),hx(st.accent2),hx(mix(st.accent,st.ink,.42)),hx(mix(st.accent2,st.ink,.42))],
          showValue:type==='doughnut',showLabel:type==='doughnut',showPercent:type==='doughnut',holeSize:62,
          showCatName:false,showBorder:false,showGridLines:type!=='doughnut',
          catAxisLabelFontFace:FB,valAxisLabelFontFace:FB,catAxisLabelColor:bodyColor,valAxisLabelColor:bodyColor,
          catAxisLineColor:hx(st.rule),valAxisLineColor:hx(st.rule),showCatAxis:type!=='doughnut',showValAxis:type!=='doughnut',
          lineSize:type==='line'?3:1,dataLabelColor:hx(st.ink),dataLabelFontFace:FB,dataLabelFontSize:11});
        sl.addText('資料來源：'+(s.chart.source||'使用者上傳資料'),{x:M,y:6.42,w:8,h:.22,fontSize:8,color:hx(st.sub),fontFace:FB});
        foot();
      }else if(s.layout==='quote'){
        kick();
        sl.addText('“',{x:M,y:1.5,w:1,h:1,fontSize:80,color:hx(st.accent),fontFace:FD});
        sl.addText((s.quote&&s.quote.text)||s.title||'',{x:M,y:2.5,w:W*.85,h:2,...titleOpts});
        sl.addText((s.quote&&s.quote.by)||'',{x:M,y:4.7,w:W,h:.45,...bodyOpts,fontSize:Math.max(12,tx.bodySize-3)});
        foot();
      }else if(s.layout==='twoCol'){
        kick();
        sl.addText(s.title||'',{x:M,y:.75+ky,w:W,h:.78,...titleOpts});
        (s.columns||[]).slice(0,2).forEach((c,ci)=>{
          const cx=M+ci*(W/2+.2), cw=W/2-.2, cy=1.75+ky;
          sl.addShape(pptx.ShapeType.rect,{x:cx,y:cy,w:cw,h:4.4-ky,fill:{color:hx(st.surface)},line:{color:hx(st.rule),width:.5}});
          sl.addShape(pptx.ShapeType.rect,{x:cx,y:cy,w:cw,h:.05,fill:{color:hx(ci?st.accent2:st.accent)}});
          sl.addText(c.h||'',{x:cx+.3,y:cy+.25,w:cw-.6,h:.55,...bodyOpts,bold:true,color:hx(tx.bodyColor||st.ink)});
          sl.addText((c.items||[]).map(it=>({text:String(it),options:{breakLine:true}})),
            {x:cx+.3,y:cy+.85,w:cw-.6,h:3.3-ky,...bodyOpts,fontSize:Math.max(12,tx.bodySize-2),lineSpacingMultiple:1.5,valign:'top'});
        });
        foot();
      }else{
        kick();
        sl.addText(s.title||'',{x:M,y:.75+ky,w:W,h:.86,...titleOpts,valign:'top'});
        sl.addShape(pptx.ShapeType.rect,{x:M,y:1.65+ky,w:.67,h:.04,fill:{color:hx(st.accent)}});
        const bs=s.bullets||[], two=bs.length>4, per=Math.ceil(bs.length/2);
        bs.forEach((b,i)=>{
          const col = two && i>=per ? 1:0, row = two ? i%per : i;
          const cw = two ? W/2-.25 : W, bx = M+col*(W/2+.25), by = 2.05+ky+row*(two?1.05:1.1);
          sl.addShape(pptx.ShapeType.rect,{x:bx,y:by+.12,w:.1,h:.1,fill:{color:hx(st.accent)}});
          sl.addText(b.h||'',{x:bx+.28,y:by,w:cw-.28,h:.48,...bodyOpts,bold:true,color:hx(tx.bodyColor||st.ink),valign:'top'});
          if(b.d) sl.addText(b.d,{x:bx+.28,y:by+.46,w:cw-.28,h:.52,...bodyOpts,fontSize:Math.max(12,tx.bodySize-4),valign:'top'});
        });
        foot();
      }
    });
    await pptx.writeFile({fileName:(S.topic||'簡報').slice(0,20)+'.pptx'});
    done();
  }catch(e){ fail(e.message||'PPTX 匯出失敗'); }
}

/* ---------- 演示模式 ---------- */
let pIdx=0;
function present(){
  const st=curStyle(), wrap=document.getElementById('presentWrap');
  wrap.innerHTML = S.slides.map((s,i)=>
    `<div class="ps" data-i="${i}" style="width:1280px;height:720px;position:relative;display:none">${renderSlide(s,st,i,S.slides.length,false)}</div>`).join('');
  document.getElementById('present').classList.add('on');
  pIdx=S.cursor; pShow(pIdx); pFit();
}
function pShow(n){
  const els=document.querySelectorAll('.ps'); if(!els.length) return;
  pIdx=Math.max(0,Math.min(els.length-1,n));
  els.forEach((e,k)=>e.style.display = k===pIdx?'block':'none');
  document.getElementById('presentHud').textContent=(pIdx+1)+' / '+els.length+'　← → 翻頁　Esc 離開';
}
function pFit(){
  const s=Math.min(innerWidth/1280,innerHeight/720)*.95;
  document.getElementById('presentWrap').style.transform='scale('+s+')';
}
function pClose(){ document.getElementById('present').classList.remove('on'); S.cursor=pIdx; render(); }
addEventListener('resize',()=>{ pFit(); fitAll(); });
addEventListener('keydown',e=>{
  if(document.getElementById('present').classList.contains('on')){
    if(e.key==='Escape') pClose();
    if(e.key==='ArrowRight'||e.key===' ') pShow(pIdx+1);
    if(e.key==='ArrowLeft') pShow(pIdx-1);
  }
});

/* 從兩個顏色推出中間色，讓自訂風格只要挑三個顏色就好 */
function hexToRgb(h){ h=String(h).replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join('');
  return [parseInt(h.slice(0,2),16)||0, parseInt(h.slice(2,4),16)||0, parseInt(h.slice(4,6),16)||0]; }
function mix(a,b,t){ const A=hexToRgb(a),B=hexToRgb(b);
  return '#'+[0,1,2].map(i=>Math.round(A[i]+(B[i]-A[i])*t).toString(16).padStart(2,'0')).join(''); }

function readRulesForm(){
  const g=x=>{const el=document.getElementById(x);return el?el.value:null;};
  if(g('rRole')===null) return null;
  const u=document.getElementById('rUnits');
  return {role:g('rRole'), audience:g('rAud'), pages:+g('rPages')||3, titleMax:+g('rTitle')||15,
    kickerMax:+g('rKicker')||20, bulletCount:+g('rCount')||4, bulletMax:+g('rLen')||30,
    units:u?u.checked:true, banned:g('rBan')||''};
}
function saveRulesForm(){
  const r=readRulesForm(); if(!r) return;
  LS.set('rulesObj',r); S.rules=buildRulesText(r); LS.set('rules',S.rules);
  if(r.pages) S.pages=r.pages;
}

/* 產生課程格式的 Markdown 大綱 */
async function genMD(){
  const el=document.getElementById('wMD'); if(el) S.md=el.value;
  const m=document.getElementById('wMat'); if(m) S.brief=m.value;
  if(!(S.brief||'').trim()) return fail('還沒有素材，請回到步驟 2。');
  toast('生成大綱中');
  try{
    const sys='你是簡報架構師。只輸出 Markdown，不要任何開場白、結語或 markdown 圍籬。';
    const out = await ask(sys, buildPrompt());
    S.md = String(out).replace(/```(markdown)?/gi,'').trim();
    saveDraft(); done();
    const el2=document.getElementById('wMD');
    if(el2){ el2.dispatchEvent(new Event('input',{bubbles:true})); }
  }catch(e){ fail(e.message); }
}

function finishWizard(){
  const el=document.getElementById('wMD'); if(el) S.md=el.value;
  try{
    const slides=parseMarkdownDeck(S.md||'');
    if(!S.topic) S.topic=slides[0].title||'未命名簡報';
    slides.forEach(s=>s.footer=(S.topic||'').slice(0,24));
    S.slides=slides; S.pages=slides.length; S.cursor=0;
    S.wizard=false; S.view='editor'; S.tab='outline'; saveDraft(); render();
  }catch(e){ fail(e.message); }
}

/* ---------- 渲染與縮放 ---------- */
function fitAll(){
  document.querySelectorAll('.frame').forEach(f=>{
    const st=f.querySelector('.stage'); if(!st) return;
    st.style.transform='scale('+(f.clientWidth/1280)+')';
  });
}
function render(){
  const app=document.getElementById('app');
  app.innerHTML = S.view==='editor' ? viewEditor() : (S.wizard ? viewWizard() : viewHome());
  document.getElementById('layer').innerHTML =
    (S.modal==='settings'?viewSettings():'') +
    (S.modal==='ownai'?viewOwnAI():'') +
    (S.modal==='chartAi'?viewChartAI():'') +
    (S.busy?`<div class="toast"><span class="dot"></span>${esc(S.busy)}…</div>`:'') +
    (S.err?`<div class="toast bad"><span>${esc(S.err)}</span><button data-act="clearErr" style="background:none;border:none;color:var(--mute);cursor:pointer;font-size:16px">×</button></div>`:'');
  fitAll();
}

/* ---------- 事件 ---------- */
document.addEventListener('click', async e=>{
  const t = e.target.closest('[data-act]'); if(!t) return;
  if(t.dataset.act==='closeModal' && e.target.closest('[data-stop]')) return;
  const a=t.dataset.act, i=+t.dataset.i, id=t.dataset.id;

  const map = {
    home:()=>{ S.view='home'; S.wizard=false; render(); },
    resume:()=>{ S.view='editor'; render(); },
    settings:()=>{ S.modal='settings'; render(); },
    closeModal:()=>{ S.modal=null; render(); },
    clearErr:()=>{ S.err=null; render(); },
    tab:()=>{ S.tab=t.dataset.k; render(); },
    tabExport:()=>{ S.tab='export'; render(); },
    go:()=>{ S.cursor=i; render(); },
    style:()=>{ S.styleId=id; LS.set('styleId',id); saveDraft(); render(); },
    delStyle:()=>{ S.styles=S.styles.filter(s=>s.id!==id); if(S.styleId===id) S.styleId=S.styles[0].id; saveCustom(); render(); },
    layout:()=>{ pushHistory(S.cursor); S.slides[S.cursor].layout=t.dataset.k; S.slides[S.cursor].status='edited'; saveDraft(); render(); },
    up:()=>{ if(i>0){ const a2=S.slides; [a2[i-1],a2[i]]=[a2[i],a2[i-1]]; S.cursor=i-1; saveDraft(); render(); } },
    down:()=>{ if(i<S.slides.length-1){ const a2=S.slides; [a2[i+1],a2[i]]=[a2[i],a2[i+1]]; S.cursor=i+1; saveDraft(); render(); } },
    dup:()=>{ S.slides.splice(i+1,0,Object.assign(JSON.parse(JSON.stringify(S.slides[i])),{id:uid(),history:[]})); saveDraft(); render(); },
    del:()=>{ if(S.slides.length<=1) return fail('至少要保留一頁。可以先「新增一頁」再刪掉這頁。');
      S.slides.splice(i,1); S.cursor=Math.max(0,Math.min(S.cursor,S.slides.length-1)); saveDraft(); render(); },
    add:()=>{ S.slides.push({id:uid(),layout:'bullets',title:'新頁面',bullets:[{h:'要點',d:''}],note:'',footer:(S.topic||'').slice(0,24),status:'draft',history:[]}); S.cursor=S.slides.length-1; saveDraft(); render(); },
    undo:()=>{ const s=S.slides[S.cursor], h=(s.history||[]); const prev=h.pop(); if(prev){ Object.assign(s,prev,{history:h}); saveDraft(); render(); } },
    present:()=>present(),
    goStep:()=>{ syncStep(); const n=+t.dataset.k; if(n<=S.step){ S.step=n; render(); } },
    pickScenario:()=>{
      const k=t.dataset.k, sc=SCENARIOS[k];
      S.scenario=k;
      if(!S.brief.trim() || S.brief===((SCENARIOS[S.prevScenario]||{}).material||'')) S.brief=sc.material||'';
      S.prevScenario=k;
      if(sc.audience||sc.pages){
        const r=rulesObj();
        if(sc.audience) r.audience=sc.audience;
        if(sc.pages) r.pages=sc.pages;
        LS.set('rulesObj',r);
      }
      S.plan = sc.outline||'';
      render();
    },
    resetMat:()=>{ S.brief=(SCENARIOS[S.scenario]||{}).material||''; S.uploads=[]; S.tables=[]; render(); },
    clearMat:()=>{ S.brief=''; S.uploads=[]; S.tables=[]; saveDraft(); render(); },
    delUpload:()=>{
      const u=(S.uploads||[]).find(x=>x.id===id); if(!u) return;
      const cur=document.getElementById('wMat'); if(cur) S.brief=cur.value;
      if(u.text && S.brief.includes(u.text)){
        S.brief=S.brief.replace(u.text,'').replace(/\n{3,}/g,'\n\n').trim();
      }else{
        fail('這個檔案的內容已經被你改過，沒辦法自動抓出來，請直接在下面的框裡刪掉。');
      }
      const ids=new Set(u.tableIds||[]);
      S.tables=(S.tables||[]).filter(table=>!ids.has(table.id));
      S.uploads=S.uploads.filter(x=>x.id!==u.id); saveDraft(); render();
    },
    upMatW:()=>pickFile(ACCEPT, f=>handleUpload(f)),
    toStep2:()=>{ S.step=2; render(); },
    toStep3:()=>{ const m=document.getElementById('wMat'); if(m) S.brief=m.value; S.step=3; render(); },
    toStep4:()=>{ saveRulesForm(); S.step=4; render(); },
    toStep5:()=>{ const e2=document.getElementById('wMD'); if(e2) S.md=e2.value; S.step=5; render(); },
    genMD:()=>genMD(),
    finishWizard:()=>finishWizard(),
    skipWizard:()=>{ syncStep(); S.wizard=false; LS.set('wizardDone',true); render(); },
    wizard:()=>{ S.wizard=true; S.view='home'; S.step=1; LS.set('wizardDone',false); render(); },
    brief:()=>{ readHome(); genFromBrief(); },
    ownai:()=>{ syncStep(); readHome(); S.modal='ownai'; render(); },
    chartAi:()=>{ ensureBriefTables();
      if(!(S.tables||[]).some(one=>numericColumns(one).length)) return fail('請先上傳 Excel／CSV，或在素材中貼上以 | 分隔的資料表。');
      S.modal='chartAi'; render(); },
    chartSuggest:()=>suggestChart(),
    importChartSpec:()=>importChartSpec(),
    chartQuick:()=>{ try{ insertChartSlide(quickChartSpec()); }catch(err){ fail(err.message); } },
    chartType:()=>{ const s=S.slides[S.cursor]; if(s&&s.chart){ pushHistory(S.cursor); s.chart.type=t.dataset.k; s.status='edited'; saveDraft(); render(); } },
    textToggle:()=>{ const s=S.slides[S.cursor]; if(!s) return; pushHistory(S.cursor);
      const style=ensureTextStyle(s), key=t.dataset.k; style[key]=!style[key]; s.status='edited'; saveDraft(); render(); },
    textAlign:()=>{ const s=S.slides[S.cursor]; if(!s) return; pushHistory(S.cursor);
      ensureTextStyle(s).align=t.dataset.k; s.status='edited'; saveDraft(); render(); },
    textApplyAll:()=>{ const cur=S.slides[S.cursor]; if(!cur) return; const style=JSON.parse(JSON.stringify(slideTextStyle(cur)));
      S.slides.forEach((s,i)=>{ pushHistory(i); s.textStyle=JSON.parse(JSON.stringify(style)); s.status='edited'; }); saveDraft(); render(); },
    textReset:()=>{ const s=S.slides[S.cursor]; if(!s) return; pushHistory(S.cursor); s.textStyle=null; s.status='edited'; saveDraft(); render(); },
    copyPrompt:()=>{
      const el=document.getElementById('promptOut'); if(!el) return;
      const say=m=>{ t.textContent=m; setTimeout(()=>{ if(t) t.textContent='複製指令'; },1800); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(el.value).then(()=>say('已複製 ✓')).catch(()=>fallback());
      } else fallback();
      function fallback(){
        el.removeAttribute('readonly'); el.focus(); el.select(); el.setSelectionRange(0,999999);
        let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
        el.setAttribute('readonly','readonly');
        say(ok?'已複製 ✓':'已全選，請按 Ctrl+C');
      }
    },
    editRules:()=>{ const b=document.getElementById('rulesBox'); if(b) S.rules=b.value;
      S.rulesOpen=!S.rulesOpen; render(); },
    saveRules:()=>{ const b=document.getElementById('rulesBox'); if(b){ S.rules=b.value; LS.set('rules',S.rules); }
      S.rulesOpen=false; render(); },
    resetRules:()=>{ S.rules=buildRulesText(); LS.set('rules',S.rules); render(); },
    importPasted:()=>importPasted(),
    adv:()=>{ readHome(); S.adv=!S.adv; render(); },
    outline:()=>{ readHome(); genOutline(); },
    local:()=>{ readHome(); genLocal(); },
    mode:()=>{ S.economy = t.dataset.k==='eco'; LS.set('economy',S.economy); render(); },
    prov:()=>{ readCfgFields(); const k=t.dataset.k, q=PROVIDERS[k];
      S.cfg.provider=k; S.cfg.base=q.base; S.cfg.model=q.model||S.cfg.model;
      S.cfg.gapMs = k==='ollama' ? 0 : (q.rpm ? Math.ceil(62000/q.rpm) : 2000);
      LS.set('cfg',S.cfg); render(); },
    pickModel:()=>{ readCfgFields(); S.cfg.model=t.dataset.k; LS.set('cfg',S.cfg); render(); },
    resetUsage:()=>{ LS.set('usage',{d:today(),n:0}); render(); },
    checkLibs:async()=>{
      const box=document.getElementById('libStatus'); if(!box) return;
      box.innerHTML='檢查中…';
      const names={pptx:'PPTX 匯出',mammoth:'Word 解析',xlsx:'Excel 解析',pdfjs:'PDF 解析'};
      const out=[];
      for(const k of Object.keys(LIBS)){
        try{
          const {url}=await loadLib(k);
          const host=/^\.\//.test(url)?'本機 lib 資料夾':url.replace(/^https:\/\//,'').split('/')[0];
          out.push(`<span style="color:var(--cy)">✓</span> ${names[k]}　<span class="mono" style="font-size:10.5px">${host}</span>`);
        }catch(e){
          out.push(`<span style="color:var(--warn)">✗</span> ${names[k]}　全部來源都連不到`);
        }
        box.innerHTML=out.join('<br>');
      }
      const bad=out.filter(x=>x.includes('✗')).length;
      out.push(bad
        ? `<div style="margin-top:8px;color:var(--warn);line-height:1.6">把對應的 .js 檔下載後放進與本頁面同一層的 <code>lib</code> 資料夾即可離線使用，詳見說明文件。</div>`
        : `<div style="margin-top:8px;color:var(--cy)">全部正常。</div>`);
      box.innerHTML=out.join('<br>');
      S.libStatus=box.innerHTML;
    },
    genAll:()=>genAll(),
    regen:()=>genOne(S.cursor).catch(err=>fail(err.message)),
    revise:()=>{ readEditorFields(); reviseOne(); },
    styleTab:()=>{ readManual(); S.styleTab=t.dataset.k; render(); },
    mkManual:()=>{
      readManual();
      const bg=S.msBg||'#0E2233', ink=S.msInk||'#EAF4FA', accent=S.msAccent||'#3FD2C7';
      const ns={ id:uid(), name:(S.msName||'').trim()||'自訂風格', desc:'自己選的配色',
        bg, ink, accent, accent2:accent,
        surface:mix(bg,ink,.07), sub:mix(bg,ink,.55), rule:mix(bg,ink,.2),
        grid:false, radius:Number(S.msRadius)||0, serif:!!S.msSerif,
        prompt:'語氣自然、具體。' };
      S.styles=S.styles.concat([ns]); S.styleId=ns.id;
      saveCustom(); LS.set('styleId',ns.id); saveDraft();
      S.msName=''; render();
    },
    mkStyle:()=>{ const el=document.getElementById('styleDesc'); createStyle(el?el.value:''); },
    impStyle:()=>pickFile('.pdf,.png,.jpg,.jpeg',importStyle),
    addMat:()=>{ const el=document.getElementById('matDraft'); if(el&&el.value.trim()){ S.materials.push({id:uid(),name:'貼上的文字 '+(S.materials.length+1),text:el.value.trim()}); saveDraft(); render(); } },
    upMat:()=>pickFile(ACCEPT, async f=>{
      toast('讀取 '+f.name);
      try{ const parsed=await parseUpload(f), text=parsed.text;
        S.materials.push({id:uid(),name:f.name,text,tableIds:(parsed.tables||[]).map(t=>t.id)});
        S.tables=(S.tables||[]).concat(parsed.tables||[]); saveDraft(); done(); }
      catch(e){ fail(e.message); } }),
    delMat:()=>{ const m=S.materials.find(one=>one.id===id), ids=new Set((m&&m.tableIds)||[]);
      S.materials=S.materials.filter(m=>m.id!==id); S.tables=(S.tables||[]).filter(t=>!ids.has(t.id)); saveDraft(); render(); },
    pptx:()=>exportPPTX(), html:()=>exportHTML(), md:()=>exportOutline(),
    expProj:()=>exportProject(), impProj:()=>pickFile('.json',importProject),
    saveCfg:()=>{
      const g=x=>{const el=document.getElementById(x);return el?el.value:'';};
      S.cfg=Object.assign({},S.cfg,{key:g('cKey').trim(),base:g('cBase').trim(),model:g('cModel').trim(),
        maxTokens:+g('cMax')||2000, gapMs:Math.max(0,+g('cGap')||0)});
      LS.set('cfg',S.cfg); S.modal=null; render();
    },
    clearKey:()=>{ S.cfg.key=''; LS.set('cfg',S.cfg); render(); }
  };
  if(map[a]) map[a]();
});

/* 表單即時同步 */
document.addEventListener('input', e=>{
  if(e.target.id==='txtTitleSize'){ const out=document.getElementById('txtTitleOut'); if(out) out.textContent=e.target.value+' pt'; return; }
  if(e.target.id==='txtBodySize'){ const out=document.getElementById('txtBodyOut'); if(out) out.textContent=e.target.value+' pt'; return; }
  if(e.target.id==='fBrief'){ S.brief=e.target.value; return; }
  if(e.target.id==='wMat'){
    S.brief=e.target.value;
    const b=document.querySelector('[data-act="toStep3"]'); if(b) b.disabled=!S.brief.trim();
    const c=document.querySelector('#wMatCount'); if(c) c.textContent=S.brief.length+' 字';
    return;
  }
  if(e.target.id==='wMD'){
    S.md=e.target.value;
    const ok=S.md.trim()?previewParse(S.md):null;
    const b=document.querySelector('[data-act="toStep5"]');
    if(b) b.disabled=!(ok&&ok.ok);
    const h=document.getElementById('mdHint');
    if(h){
      if(!ok) h.innerHTML='貼回來之後可以直接改，確認沒問題再往下。';
      else if(ok.ok && ok.thin) h.innerHTML='<span style="color:var(--warn)">只抓到一頁，也沒有條列，'+
        '是不是只貼到一半？要繼續也可以，後面再補。</span>';
      else if(ok.ok) h.innerHTML='<span style="color:var(--cy)">讀到 '+ok.n+' 頁：'+
        ok.titles.map(x=>esc(x)).join('、')+(ok.n>3?' …':'')+'</span>';
      else h.innerHTML='<span style="color:var(--warn)">'+esc(ok.msg)+'</span>';
    }
    return;
  }
  if(e.target.id==='fPages'){ S.pages=+e.target.value;
    const l=e.target.parentElement.querySelector('.lbl'); if(l) l.textContent='頁數　'+(S.pages||'自動'); }
});
function readHome(){
  const g=x=>{const el=document.getElementById(x);return el?el.value:null;};
  if(g('fBrief')!==null) S.brief=g('fBrief');
  if(g('fTopic')!==null) S.topic=g('fTopic');
  if(g('fAud')!==null) S.audience=g('fAud');
  if(g('fTone')!==null) S.tone=g('fTone');
  const p=g('fPages'); if(p!==null) S.pages=+p;
}
function syncStep(){
  const m=document.getElementById('wMat'); if(m) S.brief=m.value;
  const d2=document.getElementById('wMD'); if(d2) S.md=d2.value;
  if(document.getElementById('rRole')) saveRulesForm();
}
function readManual(){
  const g=x=>{const el=document.getElementById(x);return el?el.value:null;};
  if(g('msName')!==null) S.msName=g('msName');
  if(g('msBg')!==null) S.msBg=g('msBg');
  if(g('msInk')!==null) S.msInk=g('msInk');
  if(g('msAccent')!==null) S.msAccent=g('msAccent');
  if(g('msRadius')!==null) S.msRadius=g('msRadius');
  const c=document.getElementById('msSerif'); if(c) S.msSerif=c.checked;
}
function readCfgFields(){
  const g=x=>{const el=document.getElementById(x);return el?el.value:null;};
  if(g('cKey')!==null) S.cfg.key=g('cKey').trim();
  if(g('cBase')!==null) S.cfg.base=g('cBase').trim();
  if(g('cModel')!==null) S.cfg.model=g('cModel').trim();
  if(g('cMax')!==null) S.cfg.maxTokens=+g('cMax')||S.cfg.maxTokens;
  if(g('cGap')!==null) S.cfg.gapMs=Math.max(0,+g('cGap')||0);
}
function readEditorFields(){
  const n=document.getElementById('fNote'), ins=document.getElementById('fIns');
  if(n && S.slides[S.cursor]) S.slides[S.cursor].note=n.value;
  if(ins) S.instruction=ins.value;
}
document.addEventListener('focusout', e=>{
  if(e.target.id==='fTopic'||e.target.id==='fAud'||e.target.id==='fTone'){ readHome(); saveDraft(); return; }
  if(e.target.id==='fNote'||e.target.id==='fIns'){ readEditorFields(); saveDraft(); return; }
  const ed=e.target.closest('[data-edit]');
  if(ed && ed.isContentEditable){
    applyEdit(S.cursor, ed.dataset.edit, ed.innerText.trim());
    render();
  }
});
document.addEventListener('change',e=>{
  const map={txtFont:'fontFamily',txtTitleSize:'titleSize',txtBodySize:'bodySize',txtTitleColor:'titleColor',txtBodyColor:'bodyColor'};
  const key=map[e.target.id]; if(!key) return;
  const s=S.slides[S.cursor]; if(!s) return; pushHistory(S.cursor);
  ensureTextStyle(s)[key]=(key==='titleSize'||key==='bodySize')?Number(e.target.value):e.target.value;
  s.status='edited'; saveDraft(); render();
});
document.getElementById('present').addEventListener('click', e=>{ if(e.target.id==='present') pClose(); });

/* 拖放上傳 */
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev, e=>{
  const z=document.getElementById('dropZone'); if(!z) return;
  e.preventDefault(); z.style.borderColor='var(--mark)'; z.style.background='#1A1420';
}));
document.addEventListener('dragleave', e=>{
  const z=document.getElementById('dropZone'); if(!z||e.relatedTarget) return;
  z.style.borderColor='var(--line)'; z.style.background='transparent';
});
document.addEventListener('drop', e=>{
  const z=document.getElementById('dropZone'); if(!z) return;
  e.preventDefault();
  z.style.borderColor='var(--line)'; z.style.background='transparent';
  const f=e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if(f) handleUpload(f);
});

render();
</script>
</body>
</html>
